services:
  url-shortener-app:
    build: 
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/url-shortener-app/Dockerfile
    container_name: url-shortener-app
    environment:
      - STORAGE_TYPE=${STORAGE_TYPE:-memory}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=${PROJECT_ROOT}/out/logs
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=url-shortener-postgres 
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
    ports:
      - "5050:5050"
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    depends_on:
      url-shortener-postgres:
        condition: service_healthy
        required: false
  url-shortener-postgres:
    image: postgres:18.6-bookworm
    container_name: url-shortener-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles: ["postgres"]
    restart: always
  url-shortener-postgres-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations